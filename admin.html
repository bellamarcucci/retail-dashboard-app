<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Arkisanté</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ecommerce.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        
        <header>            
            <div class="header">
                <a href="index.html">
                    <img src="./images/logo.png" alt="Arkisante logo">
                </a>
                <!-- checkbox to control the menu -->
                <input type="checkbox" id="menu-toggle" class="menu-toggle">
                <!-- Menu btn -->
                <label for="menu-toggle" class="hamburger">
                    &#9776; 
                </label>
                <!-- Menu options -->
                <nav class="navMenu" aria-label="Primary navigation">
                    <!-- header menu -->
                    <div class="navMenu-header">
                        <span class="navMenu-title">Menu</span>

                        <!-- btn to close menu -->
                        <label for="menu-toggle" class="closeMenu">
                            ✕
                        </label>
                    </div>
                    <ul>  
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./historia.html">Nossa história</a></li>
                        <li><a href="./direcao-criativa.html">Direção criativa</a></li>
                        <li><a href="./gestao.html">Gestão 360º</a></li>
                        <li><a href="./galeria.html">Galeria</a></li>
                        <li><a href="./contatos.html">Contatos</a></li>
                        <li><a href="./ecommerce.html">Monte seu Projeto</a></li>
                        <li><a href="./admin.html">Área Admin</a></li>
                    </ul>
                    <!-- Menu dropdown img -->
                    <div class="nav-image">
                        <img src="./images/menu-img.png" alt="decor Arkisante">
                    </div>
                </nav>
            </div>
        </header>
        
        <main class="admin-container">
            <div class="charts-row">
                <div class="chart-box">
                    <h3>Sentimento das Avaliações</h3>
                    <canvas id="sentimentChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Estoque por Produto</h3>
                    <canvas id="stockChart"></canvas>
                </div>
            </div>

            <div class="inventory-section">
                <h3>Gerenciar Estoque</h3>
                <div id="inventory-list" class="inventory-grid"></div>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
