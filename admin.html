<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Arkisanté</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ecommerce.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header><div class="header"><h1 style="color:white;">Dashboard Admin</h1></div></header>
        
        <main class="admin-container">
            <div class="charts-row">
                <div class="chart-box">
                    <h3>Sentimento das Avaliações</h3>
                    <canvas id="sentimentChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Estoque por Produto</h3>
                    <canvas id="stockChart"></canvas>
                </div>
            </div>

            <div class="inventory-section">
                <h3>Gerenciar Estoque</h3>
                <div id="inventory-list" class="inventory-grid"></div>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
