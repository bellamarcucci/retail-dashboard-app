<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Projeto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ecommerce.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <header>            
            <div class="header">
                <div class="back-btn">
                    <a href="ecommerce.html" class="btn-back-store">
                        <span class="material-symbols-outlined">chevron_left</span>
                        Voltar
                    </a>
                </div>
                <a href="index.html">
                    <img src="./images/logo.png" alt="Arkisante logo">
                </a>
                <!-- checkbox to control the menu -->
                <input type="checkbox" id="menu-toggle" class="menu-toggle">
                <!-- Menu btn -->
                <label for="menu-toggle" class="hamburger">
                    &#9776; 
                </label>
                <!-- Menu options -->
                <nav class="navMenu" aria-label="Primary navigation">
                    <!-- header menu -->
                    <div class="navMenu-header">
                        <span class="navMenu-title">Menu</span>

                        <!-- btn to close menu -->
                        <label for="menu-toggle" class="closeMenu">
                            ✕
                        </label>
                    </div>
                    <ul>  
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./historia.html">Nossa história</a></li>
                        <li><a href="./direcao-criativa.html">Direção criativa</a></li>
                        <li><a href="./gestao.html">Gestão 360º</a></li>
                        <li><a href="./galeria.html">Galeria</a></li>
                        <li><a href="./contatos.html">Contatos</a></li>
                        <li><a href="./ecommerce.html">Monte seu Projeto</a></li>
                        <li><a href="./admin.html">Área Admin</a></li>
                    </ul>
                    <!-- Menu dropdown img -->
                    <div class="nav-image">
                        <img src="./images/menu-img.png" alt="decor Arkisante">
                    </div>
                </nav>
            </div>
        </header>
        
        <main class="details-container">
            <div id="product-detail-view">
                </div>
            
            <div class="reviews-section">
                <h3>Avaliações</h3>
                <div id="reviews-list"></div>
                
                <form id="review-form">
                    <h4>Deixe sua avaliação</h4>
                    <select id="review-rating">
                        <option value="5">5 Estrelas</option>
                        <option value="4">4 Estrelas</option>
                        <option value="3">3 Estrelas</option>
                        <option value="2">2 Estrelas</option>
                        <option value="1">1 Estrela</option>
                    </select>
                    <textarea id="review-comment" placeholder="Escreva seu comentário..." required></textarea>
                    <button type="submit" class="btn-learn-more">Enviar</button>
                </form>
            </div>
        </main>
    </div>
    <script src="details.js"></script>
</body>
</html>
